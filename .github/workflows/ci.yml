name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    uses: ./.github/workflows/deployment-config-reusable.yml

  frontend:
    uses: ./.github/workflows/frontend-reusable.yml

  lint:
    uses: ./.github/workflows/lint-reusable.yml
    with:
      go-version-file: backend/recap/go.mod

  test:
    needs: lint
    uses: ./.github/workflows/test-reusable.yml
    with:
      go-version-file: backend/recap/go.mod

  integration-test:
    needs: test
    uses: ./.github/workflows/test-integration-reusable.yml
    with:
      go-version-file: backend/recap/go.mod

  publish-images:
    name: Publish Docker images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - deployment-config
      - frontend
      - integration-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version-file: backend/recap/go.mod
          cache: false

      - name: Generate backend API
        run: make generate-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6.18.0
        with:
          context: backend/recap
          push: true
          tags: ghcr.io/avito-hackaton-team/avito-recap-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6.18.0
        with:
          context: frontend
          push: true
          build-args: VITE_RECAP_YEAR=2026
          tags: ghcr.io/avito-hackaton-team/avito-recap-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
