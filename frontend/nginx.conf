server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        proxy_pass http://recap:8080/readyz;
        proxy_set_header Host $host;
    }

    # SPA: любой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API уходит в Go-сервис. Имя recap — это имя сервиса в docker-compose,
    # поэтому браузер видит один origin и CORS не нужен.
    location /api/ {
        proxy_pass http://recap:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
